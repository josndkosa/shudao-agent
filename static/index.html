<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜀道智行 · 成渝行程规划智能体</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">蜀道</span>
    <h1>蜀道智行<span class="brand-sub">成渝行程规划智能体</span></h1>
  </div>
  <div class="badges">
    <span class="badge badge-offline" id="badge-offline">离线</span>
    <span class="badge" id="badge-api">检测中…</span>
  </div>
</header>

<div class="layout">
  <!-- 左栏：参数 + 双城路线图 + 逐日行程 -->
  <main class="left">
    <form class="params panel-frame" id="params-form">
      <label>天数<input id="p-days" type="number" min="1" max="5" value="3"></label>
      <label>预算<input id="p-budget" type="number" min="500" step="100" value="3000"></label>
      <label>偏好<input id="p-tags" type="text" value="美食,文化" placeholder="美食,文化,亲子…"></label>
      <label class="chk"><input id="p-family" type="checkbox">亲子</label>
      <button type="submit" class="btn-primary" id="btn-run">开始规划</button>
    </form>

    <section class="map-row">
      <div class="map-card panel-frame">
        <div class="map-frame">
          <div class="map-title c-cd"><span class="city-cn">成都</span><span class="city-meta">CHENGDU · 30.67°N 104.07°E</span></div>
          <div class="map-scale"><span class="bar"></span>10 km</div>
          <div class="compass"><span>N</span></div>
        </div>
        <div id="map-chengdu" class="map-svg"></div>
      </div>
      <div class="rail-link" id="rail-link" title="成渝高铁 1.8h ¥154">
        <svg viewBox="0 0 120 40" preserveAspectRatio="none">
          <defs>
            <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#E8A33D"/>
              <stop offset="1" stop-color="#4EA8DE"/>
            </linearGradient>
          </defs>
          <line x1="4" y1="20" x2="116" y2="20" stroke="url(#railGrad)"
                stroke-width="2" stroke-dasharray="7 5" class="rail-dash"/>
          <circle r="3" fill="#E8A33D" class="rail-dot">
            <animateMotion dur="2.4s" repeatCount="indefinite" path="M4,20 L116,20"/>
          </circle>
          <text x="60" y="12" class="rail-text" text-anchor="middle">高铁 1.8h · ¥154</text>
        </svg>
      </div>
      <div class="map-card panel-frame">
        <div class="map-frame">
          <div class="map-title c-cq"><span class="city-cn">重庆</span><span class="city-meta">CHONGQING · 29.56°N 106.55°E</span></div>
          <div class="map-scale"><span class="bar"></span>10 km</div>
          <div class="compass"><span>N</span></div>
        </div>
        <div id="map-chongqing" class="map-svg"></div>
      </div>
    </section>

    <section class="days panel-frame">
      <nav class="day-tabs" id="day-tabs"></nav>
      <div class="day-panel" id="day-panel"></div>
      <div class="budget-bar" id="budget-bar"></div>
    </section>
  </main>

  <!-- 右栏：Agent 决策回放 -->
  <aside class="right panel-frame">
    <div class="player-head">
      <h2>Agent 决策回放</h2>
      <input id="evt-search" type="search" placeholder="过滤事件（标题/理由）…">
    </div>
    <div class="player-ctrl">
      <button id="pc-first" title="跳到开头">⏮</button>
      <button id="pc-prev" title="上一步">◀</button>
      <button id="pc-play" class="pc-play" title="播放/暂停">▶</button>
      <button id="pc-next" title="下一步">▶|</button>
      <button id="pc-last" title="跳到结尾">⏭</button>
      <input id="pc-seek" type="range" min="0" max="0" value="0" step="1">
      <select id="pc-speed">
        <option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option>
      </select>
    </div>
    <div class="evt-list" id="event-list"></div>
  </aside>
</div>

<footer class="chat-bar">
  <span class="chat-hint" id="chat-hints">试试：</span>
  <input id="chat-input" type="text" placeholder="和规划师说点什么，例如：第二天太赶">
  <button class="btn-primary" id="btn-send">发送</button>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
